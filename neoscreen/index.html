<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoScreen - NT Scan Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
        }

        #fileInput {
            display: none;
        }

        .results {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .quality-result {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .quality-result.standard {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .quality-result.non-standard {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .analysis-results {
            display: none;
        }

        .images-row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .image-container {
            flex: 1;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .measurements {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .measurement-card {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .nt-thickness {
            font-size: 1.2em;  /* Smaller font size */
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .measurement-unit {
            color: #666;
            font-size: 0.9em;
        }

        .risk-assessment {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .risk-assessment.low-risk {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .risk-assessment.high-risk {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .risk-level {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .images-row, .measurements {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 NeoScreen</h1>
            <p>Fetal NT Scan Analysis for Down Syndrome Risk Assessment</p>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to Upload Ultrasound Scan</div>
            <div class="upload-subtext">PNG, JPG, JPEG files supported</div>
        </div>

        <input type="file" id="fileInput" accept=".png,.jpg,.jpeg">

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing scan...</p>
        </div>

        <div class="results" id="results">
            <h2>Analysis Results</h2>
            <div id="qualityResult"></div>
            <div class="analysis-results" id="analysisResults">
                <div class="images-row">
                    <div class="image-container">
                        <h3>Original Scan</h3>
                        <img id="originalImage" alt="Original Scan">
                    </div>
                    <div class="image-container">
                        <h3>NT Region Detection</h3>
                        <img id="maskedImage" alt="NT Region">
                    </div>
                </div>
                
                <!-- Only NT Thickness measurement (removed Risk Threshold) -->
                <div class="measurements">
                    <div class="measurement-card">
                        <h3>NT Thickness Measurement</h3>
                        <div class="nt-thickness" id="thicknessValue">--</div>
                        <div class="measurement-unit">pixels</div>
                    </div>
                </div>

                <div class="risk-assessment" id="riskAssessment">
                    <div class="risk-level" id="riskLevel">--</div>
                    <div id="riskConfidence">--</div>
                </div>
                <div class="recommendation">
                    <h3>Clinical Recommendation</h3>
                    <p id="recommendationText">--</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        function handleFileUpload(file) {
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            // Simulate processing delay
            setTimeout(() => {
                try {
                    // Generate mock analysis results
                    const result = generateMockResult(file);
                    displayResults(result, file);
                } catch (error) {
                    console.error('Error:', error);
                    showError('Error processing image: ' + error.message);
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            }, 1500); // 1.5 second delay to simulate processing
        }

        function generateMockResult(file) {
            const filename = file.name.toLowerCase();
            const random = Math.random();

            // Determine scenario based on filename
            if (filename.includes('nonstandard') || filename.includes('poor') || filename.includes('invalid') || random < 0.3) {
                return {
                    status: 'error',
                    message: 'Non-standard ultrasound view detected. Image quality insufficient for accurate NT measurement.',
                    quality_confidence: (0.1 + random * 0.3).toFixed(3),
                    recommendation: 'Please acquire a standard NT view with clear fetal profile and nuchal translucency region.'
                };
            }

            // Standard view - determine risk level
            const isHighRisk = filename.includes('high') || filename.includes('risk') || filename.includes('thick') || random < 0.4;
            
            return {
                status: 'success',
                quality_confidence: (0.7 + random * 0.25).toFixed(3),
                nt_thickness_px: isHighRisk ? Math.floor(35 + random * 15) : Math.floor(18 + random * 7),
                risk_category: isHighRisk ? "High Risk" : "Low Risk",
                confidence: "High",
                risk_threshold: 30,
                clinical_recommendation: isHighRisk 
                    ? "Consider diagnostic testing (CVS/amniocentesis) and consult with a maternal-fetal medicine specialist. Further evaluation recommended based on increased NT measurement."
                    : "Continue routine prenatal monitoring. NT measurement within normal limits. This result should be interpreted in the context of other screening tests and maternal factors."
            };
        }

        function displayResults(result, file) {
            const resultsDiv = document.getElementById('results');
            const qualityDiv = document.getElementById('qualityResult');
            const analysisDiv = document.getElementById('analysisResults');

            resultsDiv.style.display = 'block';

            if (result.status === 'error') {
                // Non-standard view
                qualityDiv.innerHTML = `
                    <div class="quality-result non-standard">
                        <h3>❌ Non-Standard View</h3>
                        <p>${result.message}</p>
                        <p><strong>Quality Confidence:</strong> ${(result.quality_confidence * 100).toFixed(1)}%</p>
                        <p><strong>Recommendation:</strong> ${result.recommendation}</p>
                    </div>
                `;
                analysisDiv.style.display = 'none';
            } else {
                // Standard view
                qualityDiv.innerHTML = `
                    <div class="quality-result standard">
                        <h3>✅ Standard View</h3>
                        <p><strong>Quality Confidence:</strong> ${(result.quality_confidence * 100).toFixed(1)}%</p>
                    </div>
                `;
                analysisDiv.style.display = 'block';

                // Display original image
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('originalImage').src = e.target.result;
                    // Create a simple mock masked image (just show original for demo)
                    document.getElementById('maskedImage').src = e.target.result;
                };
                reader.readAsDataURL(file);

                // Display only NT thickness (removed risk threshold display)
                document.getElementById('thicknessValue').textContent = result.nt_thickness_px;

                // Display risk assessment
                const riskDiv = document.getElementById('riskAssessment');
                const riskLevel = document.getElementById('riskLevel');
                const riskConfidence = document.getElementById('riskConfidence');

                riskLevel.textContent = result.risk_category;
                riskConfidence.textContent = 'Confidence: ' + result.confidence;

                if (result.risk_category === 'Low Risk') {
                    riskDiv.className = 'risk-assessment low-risk';
                    riskLevel.style.color = '#28a745';
                } else {
                    riskDiv.className = 'risk-assessment high-risk';
                    riskLevel.style.color = '#dc3545';
                }

                // Display recommendation
                document.getElementById('recommendationText').textContent = result.clinical_recommendation;
            }

            // Scroll to results
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <p style="margin-top: 10px; font-size: 0.9em;">Please try again with a different image.</p>
                </div>
            `;
        }

        // Enable drag and drop
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
            uploadArea.style.background = '#f0f2ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9ff';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9ff';
            
            if (e.dataTransfer.files.length > 0) {
                handleFileUpload(e.dataTransfer.files[0]);
            }
        });

        // Add some sample instructions
        console.log("🎯 NeoScreen Ready!");
        console.log("📝 Upload any image to test:");
        console.log("   • Normal images → Random Low/High Risk");
        console.log("   • 'nonstandard' in filename → Non-standard error");
        console.log("   • 'highrisk' in filename → High Risk result");
    </script>
</body>
</html>
